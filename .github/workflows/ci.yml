name: CI

on:
  pull_request:
    paths:
      - "Backend/**"
      - "Frontend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/dependabot.yml"
      - ".github/workflows/ci.yml"

jobs:
  # No actor check. This used to skip dependabot[bot], which meant the two jobs
  # gated on it never ran for a single dependency PR -- the exact PRs most likely
  # to break a build. TypeScript 7 (typescript-eslint hard-fails on it) and Vitest 5
  # (relative-URL fetch) both shipped through as unmergeable PRs because of it.
  #
  # Kept as a separate job rather than dropping the `if:` into `backend`/`frontend`
  # because the Playwright download in `frontend` is the expensive part, and a
  # lockfile mismatch should not have to wait behind it.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'Backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'Frontend/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/dependabot.yml'
              - '.github/workflows/ci.yml'

  # Cheapest possible signal, and the only one that catches a lockfile left out
  # of sync with a manifest. Not gated on `changes`, so a pull request that
  # touches only a manifest still gets checked -- which is the shape a Dependabot
  # PR has when its job is misconfigured, and used to be invisible here.
  #
  # Kept separate from `frontend` so it stays fast -- no lint, no typecheck, no
  # browser download -- and so a stale lockfile reports as its own failure
  # instead of as an unrelated install error buried in a long job.
  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version` here on purpose: pnpm/action-setup reads the `packageManager`
      # field from the root package.json, so the version lives in one place.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify lockfile is in sync with the manifests
        # Fails with ERR_PNPM_OUTDATED_LOCKFILE when a manifest and the lockfile
        # disagree, which is what a Dependabot PR looks like if its job is
        # pointed at a workspace subdirectory. Regenerate with `pnpm install`.
        run: pnpm install --frozen-lockfile

      # Node-only, so it costs nothing on top of the install above, and it is the
      # only place the dependabot config guard runs. Without this the guard is
      # local-only and the regression it pins can come back unnoticed.
      - name: Repository script tests
        run: pnpm run test:scripts

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Format check
        run: mvn -f Backend/pom.xml spotless:check

      - name: Run tests
        run: mvn -f Backend/pom.xml test

      - name: Package
        run: mvn -f Backend/pom.xml -DskipTests package

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version comes from the root package.json `packageManager` field.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm --dir Frontend run format:check

      - name: Lint
        run: pnpm --dir Frontend run lint

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm --dir Frontend exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm --dir Frontend run test:unit

      - name: Integration tests
        run: pnpm --dir Frontend run test:integration

      - name: Web tests
        run: pnpm --dir Frontend run test:web
